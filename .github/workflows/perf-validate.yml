name: Perf Validation

on:
  push:
    branches:
      - perf/parallel-provisioning-and-deployment
  workflow_dispatch:
    inputs:
      skip_azure:
        description: 'Skip Azure-dependent steps'
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

env:
  GOWORK: "off"

jobs:
  build-binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    outputs:
      perf-version: ${{ steps.versions.outputs.perf-version }}
      released-version: ${{ steps.versions.outputs.released-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/azd/go.mod
          cache-dependency-path: cli/azd/go.sum

      - name: Build perf binary
        working-directory: cli/azd
        run: |
          VERSION="perf-$(git rev-parse --short HEAD)"
          go build -ldflags "-X github.com/azure/azure-dev/cli/azd/internal.Version=${VERSION}" -o perf-bin/azd-perf ./

      - name: Download released binary
        working-directory: cli/azd
        run: |
          RELEASED_VERSION=$(curl -sL https://aka.ms/azd/versions/latest)
          curl -fsSL "https://azure-dev.azureedge.net/azd/standalone/release/${RELEASED_VERSION}/azd-linux-amd64" -o perf-bin/azd-released
          chmod +x perf-bin/azd-released

      - name: Capture versions
        id: versions
        working-directory: cli/azd
        run: |
          echo "perf-version=$(./perf-bin/azd-perf version --output json 2>/dev/null | head -1 || echo 'perf-unknown')" >> "$GITHUB_OUTPUT"
          echo "released-version=$(./perf-bin/azd-released version --output json 2>/dev/null | head -1 || echo 'released-unknown')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: perf-binaries
          path: cli/azd/perf-bin/
          retention-days: 7

  go-benchmarks:
    name: Go Microbenchmarks
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/azd/go.mod
          cache-dependency-path: cli/azd/go.sum

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Create worktree for upstream/main
        run: |
          git remote add upstream https://github.com/Azure/azure-dev.git || true
          git fetch upstream main --depth=1
          git worktree add /tmp/azd-main upstream/main

      - name: Run benchmarks on upstream/main
        working-directory: /tmp/azd-main/cli/azd
        run: |
          go test ./... -bench=. -benchmem -count=6 -short -timeout=20m > /tmp/bench-main.txt 2>&1 || true

      - name: Run benchmarks on perf branch
        working-directory: cli/azd
        run: |
          go test ./... -bench=. -benchmem -count=6 -short -timeout=20m > /tmp/bench-perf.txt 2>&1 || true

      - name: Compare with benchstat
        run: |
          benchstat old=/tmp/bench-main.txt new=/tmp/bench-perf.txt > /tmp/bench-comparison.txt 2>&1 || true
          echo "## Go Microbenchmark Comparison" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/bench-comparison.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up worktree
        if: always()
        run: git worktree remove /tmp/azd-main --force || true

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            /tmp/bench-main.txt
            /tmp/bench-perf.txt
            /tmp/bench-comparison.txt
          retention-days: 30

  test-parity:
    name: Unit Test Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/azd/go.mod
          cache-dependency-path: cli/azd/go.sum

      - name: Create worktree for upstream/main
        run: |
          git remote add upstream https://github.com/Azure/azure-dev.git || true
          git fetch upstream main --depth=1
          git worktree add /tmp/azd-main upstream/main

      - name: Run tests on upstream/main
        working-directory: /tmp/azd-main/cli/azd
        run: |
          go test ./... -short -json -timeout=20m > /tmp/test-main.json 2>&1 || true

      - name: Run tests on perf branch
        working-directory: cli/azd
        run: |
          go test ./... -short -json -timeout=20m > /tmp/test-perf.json 2>&1 || true

      - name: Compare test results
        run: |
          echo "## Unit Test Parity Check" >> "$GITHUB_STEP_SUMMARY"

          # Count pass/fail from JSON test output
          MAIN_PASS=$(grep -c '"Test":.*"Action":"pass"' /tmp/test-main.json || echo "0")
          MAIN_FAIL=$(grep -c '"Test":.*"Action":"fail"' /tmp/test-main.json || echo "0")
          PERF_PASS=$(grep -c '"Test":.*"Action":"pass"' /tmp/test-perf.json || echo "0")
          PERF_FAIL=$(grep -c '"Test":.*"Action":"fail"' /tmp/test-perf.json || echo "0")

          echo "| Branch | Passed | Failed |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|--------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| upstream/main | $MAIN_PASS | $MAIN_FAIL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| perf branch | $PERF_PASS | $PERF_FAIL |" >> "$GITHUB_STEP_SUMMARY"

          # Fail if perf branch has more failures
          if [ "$PERF_FAIL" -gt "$MAIN_FAIL" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ Perf branch has more test failures than upstream/main!" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Perf branch has $PERF_FAIL failures vs $MAIN_FAIL on main"
          fi

      - name: Clean up worktree
        if: always()
        run: git worktree remove /tmp/azd-main --force || true

      - uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            /tmp/test-main.json
            /tmp/test-perf.json
          retention-days: 7

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [build-binaries, go-benchmarks, test-parity]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Perf Validation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build Binaries | ${{ needs.build-binaries.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Go Benchmarks | ${{ needs.go-benchmarks.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test Parity | ${{ needs.test-parity.result }} |" >> "$GITHUB_STEP_SUMMARY"
