name: Benchmark Regression Check

on:
  pull_request:
    paths:
      - "cli/azd/**"
      - ".github/workflows/bench.yml"
    branches: [main]
  push:
    branches: [main]
    paths:
      - "cli/azd/**"
      - ".github/workflows/bench.yml"

# Cancel in-flight runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4 # TODO(security): pin to SHA

      - uses: actions/setup-go@v6 # TODO(security): pin to SHA
        with:
          go-version-file: cli/azd/go.mod

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Restore baseline
        id: cache-baseline
        uses: actions/cache@v4 # TODO(security): pin to SHA
        with:
          path: cli/azd/perf/baselines
          key: bench-baseline-${{ runner.os }}-${{ github.base_ref || 'main' }}
          restore-keys: |
            bench-baseline-${{ runner.os }}-main

      - name: Run benchmarks
        working-directory: cli/azd
        env:
          GOWORK: "off"
        run: |
          go test -bench=. -benchmem -count=6 -timeout=10m -run='^$' \
            ./internal/cmd/... \
            ./pkg/containerapps/... \
            ./pkg/environment/... \
            ./pkg/infra/provisioning/bicep/... \
            ./pkg/project/... \
            | tee bench-current.txt

      - name: Compare with baseline
        if: steps.cache-baseline.outputs.cache-hit == 'true'
        working-directory: cli/azd
        run: |
          BASELINE="perf/baselines/linux/main.txt"
          if [ -f "$BASELINE" ]; then
            benchstat old="$BASELINE" new=bench-current.txt | tee bench-diff.txt

            # Flag timing regressions >15%
            if grep -P '\+\d{2,}\.\d+%|\+1[5-9]\.\d+%' bench-diff.txt | grep -q 'sec/op'; then
              echo "::warning::Potential timing regression detected (>15%)"
            fi

            # Flag memory regressions >10%
            if grep -P '\+\d{2,}\.\d+%' bench-diff.txt | grep -q 'B/op'; then
              echo "::warning::Potential memory regression detected (>10%)"
            fi
          fi

      - name: Save baseline (main only)
        if: github.ref == 'refs/heads/main'
        working-directory: cli/azd
        run: |
          mkdir -p perf/baselines/linux
          cp bench-current.txt perf/baselines/linux/main.txt

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && steps.cache-baseline.outputs.cache-hit == 'true'
        uses: actions/github-script@v7 # TODO(security): pin to SHA
        with:
          script: |
            const fs = require('fs');
            const diffPath = 'cli/azd/bench-diff.txt';
            if (!fs.existsSync(diffPath)) return;
            const diff = fs.readFileSync(diffPath, 'utf8');
            if (!diff.trim()) return;

            const body = [
              '## 📊 Benchmark Comparison',
              '',
              '```',
              diff,
              '```',
              '',
              '<sub>Generated by bench.yml • Baselines from main</sub>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.body.includes('📊 Benchmark Comparison'),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
